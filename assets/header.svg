<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D13" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D13" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.6" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="796" height="196" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Decorative Corner Accents -->
  <circle cx="28" cy="28" r="4" fill="#38BDF8" opacity="0.6" />
  <circle cx="44" cy="28" r="4" fill="#818CF8" opacity="0.4" />
  <circle cx="60" cy="28" r="4" fill="#C084FC" opacity="0.4" />

  <circle cx="772" cy="28" r="4" fill="#F472B6" opacity="0.6" />
  <circle cx="756" cy="28" r="4" fill="#C084FC" opacity="0.4" />
  <circle cx="740" cy="28" r="4" fill="#818CF8" opacity="0.4" />

  <!-- Header Title -->
  <text x="400" y="82" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" fill="url(#titleGrad)" letter-spacing="0.5">
    Raditya Tantra Arinanta
  </text>

  <!-- Subtitle -->
  <text x="400" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#94A3B8" letter-spacing="0.3">
    Informatics Engineering Student | Cybersecurity &amp; Machine Learning Enthusiast
  </text>

  <!-- Pill Background -->
  <rect x="140" y="142" width="520" height="32" rx="16" fill="url(#pillBg)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />

  <!-- Pill Text -->
  <text x="400" y="163" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, 'Courier New', monospace" font-size="13" font-weight="500" fill="#38BDF8">
    Building Secure Systems  ·  Exploring AI/ML  ·  Web Development
  </text>
</svg>
